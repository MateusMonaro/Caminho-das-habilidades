<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro de Estudos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📚 Cronômetro de Estudos</h1>
        <p class="subtitulo">Concentre-se, estude e faça pausas.</p>

        <div class="modo">
            <button id="focoBtn" class="ativo">Foco</button>
            <button id="pausaBtn">Pausa</button>
        </div>

        <div class="cronometro">
            <span id="tempo">25:00</span>
        </div>

        <div class="botoes">
            <button id="iniciar">▶ Iniciar</button>
            <button id="pausar">⏸ Pausar</button>
            <button id="reiniciar">🔄 Reiniciar</button>
        </div>

        <div class="sessoes">
            <p>Sessões concluídas</p>
            <strong id="contadorSessoes">0</strong>
        </div>

        <p id="mensagem">Hora de estudar! 🚀</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
